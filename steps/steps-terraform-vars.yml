steps:

- bash: |
    set -eu

    echo "Setting terraform variables"

    grep -v -e '^#' -e '^$' "$(Terraform.variables)" | while read -r line; do
        # Extract key and value
        key=$(echo "$line" | cut -d'=' -f1 | sed 's/[[:space:]]//g; s/^export //')
        value=$(echo "$line" | cut -d'=' -f2- | sed 's/[[:space:]]//g; s/"//g')

        # Set variables
        echo "TF_VAR_${key}=${value}"
        export "TF_VAR_${key}=${value}"

        echo "##vso[task.setvariable variable=TF_VAR_${key}]${value}"
        echo "##vso[task.setvariable variable=TF_VAR_${key};isOutput=true]${value}"
    done

  name: setup
  displayName: Variables
  workingDirectory: terraform
