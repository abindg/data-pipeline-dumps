parameters:
  environment:
  project:
  region:
  service_connection_arm:
  terraform_container:
  component:
  TerraformVariables:
  type: 'plan'
  workingDirectory: 'terraform'
  debug: variables['System.Debug']

jobs:

- deployment: plan
  displayName: Pipeline Plan
  environment: ${{ parameters.environment }}-${{ parameters.project }}-${{ parameters.component }}

  variables:
  - group: ${{ parameters.project }}-${{ parameters.environment }}-variables

  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self

        - template: /steps/steps-terraform-init.yml@pipeline-templates
          parameters:
            azureSubscription: ${{ parameters.service_connection_arm }}
            workingDirectory: ${{ parameters.workingDirectory }}
            terraform_container: ${{ parameters.terraform_container }}
            TerraformVariables: |
              TF_VAR_environment=${{ parameters.environment }}
              TF_VAR_location=${{ parameters.region }}
              TF_VAR_project=${{ parameters.project }}
              TF_VAR_component=${{ parameters.component }}
              TF_VAR_storage_account=$(storage_account)
              TF_VAR_main_resource_group=$(resource_group)
              TF_VAR_ado_pat=$(PAT)

        - bash: |
            set -eu

            # Export TerraformVariables
            set -a
            ${{ parameters.TerraformVariables }}
            set +a

            echo "##[group] Terraform ${{ parameters.type }}"
            az login --service-principal -u '$(ARM_CLIENT_ID)' --password '$(ARM_CLIENT_SECRET)' --tenant '$(ARM_TENANT_ID)'

            export ARM_CLIENT_SECRET='$(ARM_CLIENT_SECRET)'
            export ARM_ACCESS_KEY='$(ARM_ACCESS_KEY)'

            echo "##[endgroup]"

            terraform ${{ parameters.type }} \
              -lock=true \
              -input=false \
              -refresh=true \
              -var "project=${{ parameters.project }}" \
              -var "environment=${{ parameters.environment }}" \
              -var "component=${{ parameters.component }}" \
              -var "location=$TF_VAR_location" \
              -var "main_resource_group=$TF_VAR_resource_group" \
              -var "client_id"=$(ARM_CLIENT_ID) \
              -var "client_secret"=$(ARM_CLIENT_SECRET) \
              -var "tenant_id"=$(ARM_TENANT_ID) \
              -var "ado_pat"=$(PAT) \
              -var-file="env/$TF_VAR_environment.tfvars"
          displayName: Terraform Plan
          workingDirectory: ${{ parameters.workingDirectory }}

