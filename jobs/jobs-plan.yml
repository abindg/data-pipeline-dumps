parameters:
  environment:
  envVariables: {}
  project:
  region:
  service_connection_arm:
  type: 'plan'
  workingDirectory: 'terraform'
  debug: variables['System.Debug']

jobs:

- job: plan
  displayName: Pipeline Plan

  variables:
  - group: ${{ parameters.environment }}-${{ parameters.project }}-variables

  steps:
  - checkout: self

  - template: steps-terraform-vars.yml

  - template: steps-terraform-init.yml
    parameters:
      TerraformVariables:
        TF_VAR_environment: ${{ parameters.environment }}
        TF_VAR_region: ${{ parameters.region }}
        TF_VAR_application: ${{ lower(parameters.project) }}
        TF_VAR_resource_group: $(TF_VAR_resource_group)
        TF_VAR_storage_account: $(TF_VAR_storage_account)
        TF_VAR_project: $(Build.Repository.Name)
        TF_VAR_repository: $(Build.Repository.Uri)
      name: ${{ parameters.environment }}-${{ lower(parameters.project) }}
      workingDirectory: ${{ parameters.workingDirectory }}
      azureSubscription: ${{ parameters.service_connection_arm }}

  - bash: |
      set -eu

      echo "##[group] Terraform ${{ parameters.type }}"
      az login --service-principal -u '$(ARM_CLIENT_ID)' --password '$(ARM_CLIENT_SECRET)' --tenant '$(ARM_TENANT_ID)'

      export ARM_CLIENT_SECRET='$(ARM_CLIENT_SECRET)'
      export ARM_ACCESS_KEY='$(ARM_ACCESS_KEY)'

      echo "##[endgroup]"

      terraform ${{ parameters.type }} \
        -lock=true \
        -input=false \
        -refresh=true \
        -var "location=${{ parameters.region }}" \
        -var "project=$(Build.Repository.Name)" \
        -var "repository=$(Build.Repository.Uri)" \
        -var-file="$(Terraform.variables)"
    displayName: Terraform Plan
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ${{ parameters.envVariables }}

